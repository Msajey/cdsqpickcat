<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安全验证</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        #msg-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #msg {
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
        }
        /* 刷新按钮的样式 */
        #refresh-btn {
            padding: 10px 24px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
        }
        #captcha-element {
            /* 验证码渲染容器 */
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 提示和刷新容器 -->
    <div id="msg-container">
        <div id="msg">正在加载安全验证组件，请稍候...</div>
        <!-- 这个按钮既用来手动刷新，也直接绑定给阿里云作为触发按钮 -->
        <button id="refresh-btn" style="display:none;" onclick="location.reload()">加载慢？点击刷新</button>
    </div>
    
    <div id="captcha-element"></div>

    <!-- 引入阿里云官方 JS -->
    <script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
    
    <script>
        window.onload = function() {
            var msg = document.getElementById('msg');
            var refreshBtn = document.getElementById('refresh-btn');
            
            // 如果 3 秒后验证码还没出来，就显示刷新按钮
            var timeoutTimer = setTimeout(function() {
                msg.innerText = '加载时间较长，可能是网络问题或组件异常。';
                refreshBtn.style.display = 'block';
            }, 3000);

            // 检查 JS 是否加载成功
            if (typeof initAliyunCaptcha === 'undefined') {
                clearTimeout(timeoutTimer);
                msg.innerText = '【错误】阿里云 JS 加载失败，请检查网络。';
                refreshBtn.style.display = 'block';
                return;
            }

            try {
                initAliyunCaptcha({
                    SceneId: "1icer78a",
                    prefix: "1rbwn", 
                    button: "#refresh-btn", // 【核心】直接把刷新按钮绑给阿里云
                    captchaVerifyCallback: function(captchaVerifyParam) {
                        // 验证成功，把参数交给原生
                        if (window.AndroidBridge) {
                            window.AndroidBridge.onLoginData(captchaVerifyParam);
                        } else {
                            msg.innerText = '验证成功！但未检测到 App 环境。';
                            refreshBtn.style.display = 'none';
                        }
                        return { captchaResult: true };
                    }
                });

                // 初始化成功，清掉超时提示，隐藏按钮
                clearTimeout(timeoutTimer);
                msg.innerText = '请拖动下方滑块完成验证';
                // 因为验证码出来了，就不需要手动刷新按钮了
                refreshBtn.style.display = 'none';

            } catch(e) {
                clearTimeout(timeoutTimer);
                msg.innerText = '【初始化失败】' + e.message;
                refreshBtn.style.display = 'block';
            }
        };
    </script>
</body>
</html>
