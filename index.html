<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安全验证</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        #container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #msg {
            color: #ff4d4f;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="msg">正在加载验证组件，请稍候...</div>
        <div id="captcha-element"></div>
    </div>
    
    <!-- 这是一个隐藏的按钮，阿里云验证码初始化需要它 -->
    <button id="btn" style="display:none;">验证</button>

    <!-- 阿里云官方验证码 JS -->
    <script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
    
    <script>
        window.onload = function() {
            var msg = document.getElementById('msg');
            
            // 1. 检查 JS 是否成功加载
            if (typeof initAliyunCaptcha === 'undefined') {
                msg.innerText = '【错误】阿里云 JS 加载失败，请检查网络。';
                return;
            }

            msg.style.display = 'none';

            // 2. 初始化验证码
            try {
                initAliyunCaptcha({
                    SceneId: "1icer78a",
                    prefix: "1rbwn", 
                    button: "#btn",
                    captchaVerifyCallback: function(captchaVerifyParam) {
                        
                        // 3. 验证成功！直接把这个参数塞给原生 App
                        if (window.AndroidBridge) {
                            // 注意：这里只传了验证码，因为账号密码原生已经在内存里了
                            window.AndroidBridge.onLoginData(captchaVerifyParam);
                        } else {
                            msg.innerText = '【错误】未检测到 App 环境。';
                            msg.style.display = 'block';
                        }
                        
                        return { captchaResult: true };
                    }
                });
            } catch(e) {
                msg.innerText = '【初始化失败】' + e.message;
                msg.style.display = 'block';
            }
        };
    </script>
</body>
</html>
